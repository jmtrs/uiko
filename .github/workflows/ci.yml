name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Lockfile is current
        run: cargo metadata --locked --no-deps > /dev/null
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Compiler fixture emits deterministic UiManifest
        run: |
          cargo run --quiet -p uiko-cli -- build experiments/fixtures/compiler-support-console \
            --ui-manifest /tmp/compiler-fixture.uiko-manifest.json
          jq -e '
            .specVersion == 1
            and .app == "support-console"
            and (.routes | length) == 2
            and ([.routes[].id] | index("customers.CustomerList") != null)
            and ([.routes[].id] | index("customers.CustomerDetail") != null)
            and ([.routes[].queries[].id] | index("customers.CustomerDetail.query.customer") != null)
            and ((.routes[] | select(.id == "customers.CustomerList") | .state) | any(.id == "status" and .initial == null))
            and ((.routes[] | select(.id == "customers.CustomerList") | .state) | any(.id == "page" and .initial == 1))
            and ((.routes[] | select(.id == "customers.CustomerList") | .components) | any(.kind == "Select" and .state == "status"))
            and ((.routes[] | select(.id == "customers.CustomerList") | .components) | any(.kind == "Pagination" and .state == "page" and .page == "customers.page" and .pageSize == "customers.pageSize" and .total == "customers.total"))
            and ((.routes[] | select(.id == "customers.CustomerDetail") | .components) | any(.kind == "Field" and .binding == "customer.phone" and .fallback == "Not provided"))
            and ([.routes[].queries[] | has("providerId")] | any | not)
            and ([.routes[].queries[] | has("externalOperationId")] | any | not)
            and ([.routes[].queries[] | has("method")] | any | not)
            and ([.routes[].queries[] | has("path")] | any | not)
          ' /tmp/compiler-fixture.uiko-manifest.json > /dev/null
      - name: Measured C_UIKO base starts with zero routes
        run: |
          cargo run --quiet -p uiko-cli -- build fixtures/support-console \
            --ui-manifest /tmp/g0-c-uiko-base.uiko-manifest.json
          jq -e '
            .specVersion == 1
            and .app == "support-console"
            and (.routes | length) == 0
          ' /tmp/g0-c-uiko-base.uiko-manifest.json > /dev/null
      - name: C_UIKO prerequisite bases compile deterministically
        run: |
          base="$(git rev-parse HEAD)"
          first_d05=""
          for task in G0-D03 G0-D04 G0-D05; do
            git reset --hard --quiet "$base"
            sha="$(bash experiments/g0/materialize-prerequisite-base.sh C_UIKO "$task" .)"
            cargo run --quiet -p uiko-cli -- build fixtures/support-console \
              --ui-manifest "/tmp/$task.uiko-manifest.json"
            jq -e '(.routes | length) == 1' "/tmp/$task.uiko-manifest.json" > /dev/null
            if [[ "$task" == "G0-D05" ]]; then
              first_d05="$sha"
            fi
          done
          git reset --hard --quiet "$base"
          second_d05="$(bash experiments/g0/materialize-prerequisite-base.sh C_UIKO G0-D05 .)"
          test "$first_d05" = "$second_d05"

  vue-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosts/vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Install exact direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  b-full:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baselines/b-full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Use frozen npm
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"
      - name: Install exact direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Generate frozen OpenAPI types
        run: npm run generate:api
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: B-full prerequisite bases typecheck deterministically
        run: |
          base="$(git rev-parse HEAD)"
          first_d05=""
          for task in G0-D03 G0-D04 G0-D05; do
            git reset --hard --quiet "$base"
            rm -f package-lock.json src/api/generated/schema.d.ts
            sha="$(bash ../../experiments/g0/materialize-prerequisite-base.sh B_FULL "$task" ../..)"
            npm run generate:api
            npm run typecheck
            npm run lint
            if [[ "$task" == "G0-D05" ]]; then
              first_d05="$sha"
            fi
          done
          git reset --hard --quiet "$base"
          rm -f package-lock.json src/api/generated/schema.d.ts
          second_d05="$(bash ../../experiments/g0/materialize-prerequisite-base.sh B_FULL G0-D05 ../..)"
          test "$first_d05" = "$second_d05"

  repository-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Architecture spec is present
        run: test -f docs/architecture/uiko_Product_Technical_Architecture_PoC_v0.16.md
      - name: Hold-out tasks are not committed in plaintext task files
        run: |
          test ! -d experiments/tasks/holdout || \
            ! find experiments/tasks/holdout -type f \( -name '*.json' -o -name '*.md' \) | grep -q .
      - name: Frozen G0 manifests are valid JSON
        run: |
          jq empty \
            baselines/b-full/package.json \
            baselines/b-full/stack-lock.json \
            experiments/tasks/dev-manifest.json \
            experiments/fixtures/g0-support-api.openapi.json \
            experiments/g0/path-policy.json \
            experiments/g0/prerequisite-bases.json \
            experiments/g0/run-result.schema.json \
            experiments/g0/trace-event.schema.json \
            experiments/g0/run-template.json \
            hosts/vue/package.json \
            hosts/vue/tsconfig.json
      - name: G0 prerequisite graph is explicit and materializer is valid shell
        run: |
          bash -n experiments/g0/materialize-prerequisite-base.sh
          jq -e '
            .schemaVersion == 1
            and .taskBases.B_FULL["G0-D03"] == "D01"
            and .taskBases.B_FULL["G0-D04"] == "D02"
            and .taskBases.B_FULL["G0-D05"] == "D03"
            and .taskBases.B_FULL["G0-D06"] == "D02"
            and .taskBases.C_UIKO == .taskBases.B_FULL
            and .taskBases.R_RENDER_ONLY["G0-D05"] == "D03"
            and .taskBases.T_AUTHORING["G0-D05"] == "D03"
            and (.templates.B_FULL | keys == ["D01","D02","D03"])
            and (.templates.C_UIKO | keys == ["D01","D02","D03"])
          ' experiments/g0/prerequisite-bases.json > /dev/null
      - name: G0 task set and probes are frozen
        run: |
          jq -e '
            .status == "frozen-g0-v1"
            and (.tasks | length) == 6
            and ([.tasks[].id] | unique | length) == 6
            and ([.tasks[] | select(.probes | index("R_RENDER_ONLY"))] | length) >= 3
            and ([.tasks[] | select(.probes | index("T_AUTHORING"))] | length) >= 3
          ' experiments/tasks/dev-manifest.json > /dev/null
      - name: B-full stack uses exact frozen versions
        run: |
          jq -e '.status == "frozen-g0-v1" and .freezeRules.exactVersionsOnly == true' \
            baselines/b-full/stack-lock.json > /dev/null
          jq -e '
            ([.dependencies[], .devDependencies[]] | all(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
          ' baselines/b-full/package.json > /dev/null
      - name: Primary G0 bases contain no pre-solved customer tasks
        run: |
          ! grep -R -n -E 'listCustomers|getCustomer|listCustomerOrders|/customers' \
            baselines/b-full/src \
            fixtures/support-console/uiko.jsonc
          test ! -d fixtures/support-console/features || \
            ! find fixtures/support-console/features -type f | grep -q .
      - name: Vue host uses exact direct versions
        run: |
          jq -e '
            ([.dependencies[], .devDependencies[]] | all(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
          ' hosts/vue/package.json > /dev/null
      - name: Browser host contains no upstream transport details
        run: |
          ! grep -R -n -E 'crm|getCustomer|/customers/\\{|/customers/:|uiko\.openapi-http' hosts/vue/src
      - name: G0 contract and metric policy are frozen
        run: |
          jq -e '.openapi == "3.1.0" and .info.version == "1.0.0"' \
            experiments/fixtures/g0-support-api.openapi.json > /dev/null
          jq -e '
            .status == "frozen-g0-v1"
            and .tokenization.id == "unicode-lexical-v1"
            and .tokenization.pattern == "[\\p{L}\\p{N}_]+|[^\\s]"
            and .tokenization.diffAlgorithm == "Myers diff over token sequences"
            and (.arms.C_UIKO.coreOwned | index("hosts/**") != null)
          ' experiments/g0/path-policy.json > /dev/null
      - name: G0 trace schema is versioned and arm-neutral
        run: |
          jq -e '
            (.properties.schemaVersion.const == 1)
            and (.properties.arm.enum == ["B_FULL","C_UIKO","R_RENDER_ONLY","T_AUTHORING"])
            and (.properties.kind.enum | index("edit") != null)
            and (.properties.kind.enum | index("repair") != null)
          ' experiments/g0/trace-event.schema.json > /dev/null
